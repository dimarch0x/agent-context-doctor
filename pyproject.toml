[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agctx"
version = "0.1.1"
description = "Linter for AI agent context files: AGENTS.md, CLAUDE.md, GEMINI.md, SKILL.md, rules/*.md"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dmitry" }]
keywords = ["agents", "agents.md", "mcp", "llm", "linter", "context"]

[project.scripts]
agctx = "agctx.cli:main"

[project.urls]
Homepage = "https://github.com/dimarch0x/agent-context-doctor"
Repository = "https://github.com/dimarch0x/agent-context-doctor"
Issues = "https://github.com/dimarch0x/agent-context-doctor/issues"

[tool.setuptools]
packages = ["agctx"]
